<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Our Talk · 私密聊天</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Ma+Shan+Zheng&family=ZCOOL+KuaiLe&family=Liu+Jian+Mao+Cao&family=ZCOOL+XiaoWei&display=swap');

        :root {
            --theme-bg: #fff5f7;
            --theme-border: #fde8ee;
            --theme-input: #fde8ee;
            --bubble-left-bg: #fde8ee;
            --bubble-right-bg: #f8d8e0;
            --font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif;
            --font-size: 14px;
            --text-color: #5a3e44;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        html, body { height: 100%; overflow: hidden; background: #fce8ec; }
        body { display: flex; justify-content: center; align-items: center; padding: 6px; height: 100dvh; }
        .app { width: 100%; max-width: 420px; height: 100%; max-height: 98dvh; background: var(--theme-bg); border-radius: 28px; box-shadow: 0 8px 32px rgba(255, 150, 180, 0.08); display: flex; flex-direction: column; overflow: hidden; border: 1px solid rgba(255, 220, 230, 0.25); position: relative; padding-bottom: env(safe-area-inset-bottom, 8px); }

        .bg-image-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-size: cover; background-position: center; opacity: 0.3; z-index: 0; pointer-events: none; }
        .header, .msgs, .bottom-area { position: relative; z-index: 2; }

        .header { padding: 12px 14px; background: transparent; border-bottom: 1px solid var(--theme-border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; z-index: 10; }
        .header-center { display: flex; align-items: center; }
        .header-center .av { width: 52px; height: 52px; border-radius: 50%; flex-shrink: 0; border: 3px solid #fff; box-shadow: 0 4px 10px rgba(255, 150, 180, 0.2); display: flex; align-items: center; justify-content: center; color: #fff; cursor: pointer; user-select: none; background-size: cover; background-position: center; overflow: hidden; background-color: #d4a8b8; }
        .header-center .av:first-child { margin-right: -24px; z-index: 99; position: relative; }
        .header-center .av:last-child { z-index: 1; background-color: #f0b8c8; }
        .header-center .av span { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; font-weight: 600; font-size: 20px; pointer-events: none; }
        .header-left .name-input, .header-right .name-input { font-weight: 600; border: 1.5px solid var(--theme-border); border-radius: 4px; padding: 2px 6px; outline: none; width: 56px; display: none; background: #fff; }

        .msgs { flex: 1; padding: 6px 10px 4px; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; background: transparent; min-height: 0; z-index: 1; position: relative; }
        .empty { text-align: center; padding: 16px; align-self: center; opacity: 0.7; font-family: var(--font-family); font-size: var(--font-size); color: var(--text-color); }
        .msgs::-webkit-scrollbar { width: 3px; }
        .msgs::-webkit-scrollbar-thumb { background: #f5d8e0; border-radius: 10px; }

        .msg-wrap { display: flex; flex-direction: row; align-items: flex-start; gap: 6px; max-width: 92%; }
        .msg-wrap.sent { align-self: flex-end; flex-direction: row-reverse; }
        .msg-wrap.received { align-self: flex-start; flex-direction: row; }
        .msg-wrap .msg-avatar { width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0; background-size: cover; background-position: center; border: 2px solid #fff; box-shadow: 0 2px 8px rgba(255,150,180,0.15); margin-top: 2px; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; color: #fff; cursor: pointer; user-select: none; }
        .msg-wrap .msg-avatar.p-avatar { background-color: #d4a8b8; }
        .msg-wrap .msg-avatar.s-avatar { background-color: #f0b8c8; }
        .msg-wrap .bubble-wrapper { display: flex; flex-direction: column; max-width: 82%; }
        .msg-wrap .bubble { padding: 6px 12px; border-radius: 12px; line-height: 1.5; word-break: break-word; position: relative; user-select: none; font-family: var(--font-family); font-size: var(--font-size); color: var(--text-color); }
        .msg-wrap.received .bubble { background: var(--bubble-left-bg); border-radius: 12px 12px 12px 4px; }
        .msg-wrap.sent .bubble { background: var(--bubble-right-bg); border-radius: 12px 12px 4px 12px; }
        .msg-wrap .bubble .time { opacity: 0.5; margin-top: 2px; text-align: right; display: block; font-size: 10px; }

        .pat-msg { font-size: 10px !important; color: #8a7a7e !important; padding: 1px 0; display: inline-block; opacity: 0.85; }

        .tomato-emoji { position: fixed; z-index: 9999; pointer-events: none; }

        .shard {
            position: fixed;
            z-index: 9998;
            pointer-events: none;
            border-radius: 50%;
            background: #e74c3c;
            animation: shardFly 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) forwards;
        }
        @keyframes shardFly {
            0% { transform: translate(0, 0) scale(1); opacity: 1; }
            100% { transform: translate(var(--dx), var(--dy)) scale(0.3) rotate(360deg); opacity: 0; }
        }

        .pat-toast { position: absolute; top: 45%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.65); color: #fff !important; padding: 8px 22px; border-radius: 24px; font-size: 15px !important; z-index: 60; animation: patFade 1.8s ease forwards; pointer-events: none; white-space: nowrap; }
        @keyframes patFade { 0% { opacity: 0; transform: translate(-50%,-50%) scale(0.85); } 12% { opacity: 1; transform: translate(-50%,-50%) scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%,-55%) scale(1); } }

        .bottom-area { flex-shrink: 0; background: transparent; border-top: 1px solid var(--theme-border); padding-bottom: 6px; }
        .input-area { padding: 4px 10px; }
        .input-row { display: flex; gap: 5px; align-items: center; }
        .input-row input { flex: 1; padding: 6px 12px; border: 1.5px solid var(--theme-border); border-radius: 20px; background: #fff; outline: none; min-width: 0; font-family: var(--font-family); font-size: var(--font-size); color: var(--text-color); }
        .input-row .btn-send, .input-row .btn-dice { background: var(--theme-input); border: none; width: 34px; height: 34px; border-radius: 50%; color: #b08a92; cursor: pointer; border: 1.5px solid var(--theme-border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }

        .bottom-bar { display: flex; align-items: center; justify-content: space-around; padding: 3px 8px 2px; gap: 2px; }
        .bottom-bar .func-btn { background: var(--theme-input); border: none; padding: 4px 8px; border-radius: 30px; cursor: pointer; display: flex; align-items: center; gap: 3px; flex: 1; justify-content: center; border: 1px solid transparent; }
        .bottom-bar .func-btn .icon { width: 16px; height: 16px; display: inline-flex; align-items: center; justify-content: center; color: #b08a92; }
        .bottom-bar .func-btn .label { font-size: 10px; font-family: var(--font-family); color: var(--text-color); }

        .icon-svg { display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
        .icon-svg svg { display: block; width: 100%; height: 100%; fill: currentColor; }

        .call-float { position: absolute; bottom: 90px; right: 16px; width: 52px; height: 52px; border-radius: 50%; background: rgba(255,255,255,0.5); backdrop-filter: blur(12px); box-shadow: 0 4px 24px rgba(0,0,0,0.08); display: none; align-items: center; justify-content: center; flex-direction: column; cursor: grab; z-index: 50; border: 2px solid rgba(255,255,255,0.4); touch-action: none; }
        .call-float .float-avatar { width: 38px; height: 38px; border-radius: 50%; background-color: #f0b8c8; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; color: #fff; border: 2px solid rgba(255,255,255,0.3); background-size: cover; background-position: center; cursor: pointer; pointer-events: none; }
        .call-float .float-avatar span { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; pointer-events: none; }
        .call-float .float-time { font-size: 9px; font-weight: 500; pointer-events: none; }

        .call-fullscreen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(160deg, #1a1a2e, #16213e, #0f3460); z-index: 100; display: none; flex-direction: column; align-items: center; justify-content: center; border-radius: 28px; overflow: hidden; }
        .call-fullscreen.open { display: flex; }
        .call-fullscreen .bg-glow { position: absolute; width: 280px; height: 280px; border-radius: 50%; background: radial-gradient(circle, rgba(76, 175, 80, 0.15), transparent 70%); top: 20%; left: 50%; transform: translateX(-50%); animation: glow-pulse 2s infinite; }
        @keyframes glow-pulse { 0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.5; } 50% { transform: translateX(-50%) scale(1.2); opacity: 1; } }
        .call-fullscreen .call-close-btn { position: absolute; top: 14px; left: 16px; background: rgba(255,255,255,0.08); border: none; padding: 6px 12px; border-radius: 30px; cursor: pointer; z-index: 10; display: flex; align-items: center; gap: 4px; color: rgba(255,255,255,0.5); }
        .call-fullscreen .call-avatar-big { width: 80px; height: 80px; border-radius: 50%; background-color: #f0b8c8; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 34px; color: #fff; z-index: 2; border: 4px solid rgba(255,255,255,0.15); background-size: cover; background-position: center; cursor: pointer; animation: avatar-breath 2s ease-in-out infinite; }
        .call-fullscreen .call-avatar-big span { display: flex; align-items: center; justify-content: center; width: 100%; height: 100%; pointer-events: none; }
        @keyframes avatar-breath { 0%, 100% { box-shadow: 0 0 40px rgba(240,184,200,0.15); } 50% { box-shadow: 0 0 80px rgba(240,184,200,0.3); } }
        .call-fullscreen .call-name-big { font-weight: 600; margin-top: 12px; z-index: 2; font-size: 22px; color: #fff; }
        .call-fullscreen .call-status-big { margin-top: 3px; z-index: 2; font-size: 14px; color: rgba(255,255,255,0.6); }
        .call-fullscreen .call-timer { margin-top: 6px; z-index: 2; font-size: 13px; color: rgba(255,255,255,0.4); }
        .call-actions { display: flex; gap: 30px; margin-top: 30px; z-index: 2; }
        .call-actions button { width: 50px; height: 50px; border-radius: 50%; border: none; cursor: pointer; background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.04); display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.7); }
        .call-actions button svg { fill: rgba(255,255,255,0.7); }
        .call-buttons-row { display: flex; gap: 50px; margin-top: 24px; z-index: 2; }
        .call-buttons-row .btn-hangup, .call-buttons-row .btn-answer { width: 68px; height: 68px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .call-buttons-row .btn-hangup { background: #e74c3c; }
        .call-buttons-row .btn-answer { background: #2ecc71; display: none; }
        .call-buttons-row .btn-answer.show { display: flex; }

        .modal-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,245,247,0.96); z-index: 80; display: none; flex-direction: column; border-radius: 28px; overflow: hidden; }
        .modal-overlay.open { display: flex; }
        .modal-header { padding: 12px 16px 8px; background: var(--theme-bg); border-bottom: 1px solid var(--theme-border); display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; }
        .modal-header h3 { font-family: var(--font-family); font-size: var(--font-size); color: var(--text-color); display: flex; align-items: center; gap: 4px; }
        .modal-header .close { background: none; border: none; cursor: pointer; }
        .modal-body { flex: 1; overflow-y: auto; padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 10px; }

        .color-box, .speed-box, .style-box, .pat-box { background: var(--theme-input); border-radius: 14px; padding: 12px; border: 1px solid var(--theme-border); }
        .speed-box .label, .style-box .label, .pat-box .label, .color-box .label { font-family: var(--font-family); font-size: var(--font-size); color: var(--text-color); display: flex; align-items: center; gap: 4px; font-weight: 500; }

        input[type="range"] { accent-color: #ecc0ca; }
        input[type="color"] { border: none; background: none; cursor: pointer; }

        .card-toolbar { display: flex; gap: 6px; margin-bottom: 6px; flex-wrap: wrap; }
        .card-toolbar input { flex: 1; padding: 4px 10px; border: 1.5px solid var(--theme-border); border-radius: 8px; background: #fff; outline: none; min-width: 80px; font-family: var(--font-family); font-size: var(--font-size); }
        .card-toolbar button { padding: 4px 10px; border: 1.5px solid var(--theme-border); border-radius: 8px; background: #fff; cursor: pointer; display: flex; align-items: center; gap: 3px; font-family: var(--font-family); font-size: var(--font-size); }

        .batch-bar { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; padding: 8px; background: #fff; border-radius: 8px; border: 1px solid var(--theme-border); }
        .batch-bar button { padding: 4px 10px; border: 1.5px solid var(--theme-border); border-radius: 6px; background: #fff; cursor: pointer; font-size: 11px; display: flex; align-items: center; gap: 4px; font-family: var(--font-family); }

        .card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px; max-height: 300px; overflow-y: auto; padding: 4px; }
        .card-item { display: flex; align-items: center; justify-content: space-between; padding: 8px 10px; background: #fef8fa; border-radius: 8px; border: 1px solid #fde8ee; gap: 6px; min-height: 40px; }
        .card-item .text { flex: 1; word-break: break-all; font-size: 12px; font-family: var(--font-family); }
        .card-item .checkbox { width: 18px; height: 18px; border: 2px solid #f5d0d8; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 12px; color: #fff; }
        .card-item .checkbox.checked { background: #ff6b8a; border-color: #ff6b8a; }
        .card-item .actions { display: flex; gap: 4px; flex-shrink: 0; }
        .card-item .actions button { background: #fff; border: 1px solid #fde8ee; border-radius: 6px; padding: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .card-item .edit-input { flex: 1; padding: 2px 6px; border: 1.5px solid var(--theme-border); border-radius: 4px; background: #fff; outline: none; display: none; font-family: var(--font-family); font-size: 12px; }
        .card-item.editing .text { display: none; }
        .card-item.editing .edit-input { display: block; }
        .card-item.editing .actions .edit { display: none; }
        .card-item .actions .save { display: none; }
        .card-item.editing .actions .save { display: inline-flex; }
        .empty-hint { text-align: center; padding: 14px; opacity: 0.6; }
        .modal-footer { padding: 6px 14px 12px; border-top: 1px solid var(--theme-border); display: flex; gap: 6px; flex-shrink: 0; }
        .modal-footer textarea { flex: 2; padding: 4px 10px; border: 1.5px solid var(--theme-border); border-radius: 10px; background: #fff; outline: none; resize: vertical; min-height: 28px; max-height: 50px; font-family: var(--font-family); font-size: var(--font-size); }
        .modal-footer .batch-btn { flex: 1; padding: 4px 12px; border: 1.5px solid var(--theme-border); border-radius: 30px; background: var(--theme-input); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 4px; font-family: var(--font-family); }

        .dice-flex-container { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
        .dice-3d-container { perspective: 800px; width: 48px; height: 48px; flex-shrink: 0; }
        .dice-3d { width: 100%; height: 100%; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .dice-3d.rolling { transition: transform 0.2s; animation: diceRollWeChat 1.5s cubic-bezier(0.25, 0.1, 0.25, 1) forwards; }
        @keyframes diceRollWeChat { 0% { transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg); } 15% { transform: rotateX(180deg) rotateY(120deg) rotateZ(100deg); } 35% { transform: rotateX(360deg) rotateY(240deg) rotateZ(200deg); } 55% { transform: rotateX(540deg) rotateY(360deg) rotateZ(300deg); } 70% { transform: rotateX(720deg) rotateY(480deg) rotateZ(400deg); } 85% { transform: rotateX(900deg) rotateY(600deg) rotateZ(500deg); } 100% { transform: rotateX(1080deg) rotateY(720deg) rotateZ(600deg); } }
        .dice-3d .face { position: absolute; width: 48px; height: 48px; background: linear-gradient(135deg, #ffe4eb, #ffd0db); border: 2px solid #ffc1cf; border-radius: 10px; box-shadow: inset 0 0 8px rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center; backface-visibility: hidden; }
        .dice-3d .face .dot-grid { display: grid; width: 34px; height: 34px; padding: 2px; gap: 4px; }
        .dice-3d .face .dot { width: 8px; height: 8px; border-radius: 50%; background: #d66b85; box-shadow: inset 0 2px 4px rgba(150, 50, 80, 0.5); }
        .dice-3d .face .grid-1 { grid-template-columns: 1fr; grid-template-rows: 1fr; place-items: center; }
        .dice-3d .face .grid-2 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; place-items: center; }
        .dice-3d .face .grid-2 .dot:nth-child(1) { grid-column: 1; grid-row: 2; }
        .dice-3d .face .grid-2 .dot:nth-child(2) { grid-column: 2; grid-row: 1; }
        .dice-3d .face .grid-3 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; place-items: center; }
        .dice-3d .face .grid-3 .dot:nth-child(1) { grid-column: 1; grid-row: 1; }
        .dice-3d .face .grid-3 .dot:nth-child(2) { grid-column: 2; grid-row: 2; }
        .dice-3d .face .grid-3 .dot:nth-child(3) { grid-column: 3; grid-row: 3; }
        .dice-3d .face .grid-4 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; place-items: center; }
        .dice-3d .face .grid-5 { grid-template-columns: 1fr 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; place-items: center; }
        .dice-3d .face .grid-5 .dot:nth-child(1) { grid-column: 1; grid-row: 1; }
        .dice-3d .face .grid-5 .dot:nth-child(2) { grid-column: 3; grid-row: 1; }
        .dice-3d .face .grid-5 .dot:nth-child(3) { grid-column: 2; grid-row: 2; }
        .dice-3d .face .grid-5 .dot:nth-child(4) { grid-column: 1; grid-row: 3; }
        .dice-3d .face .grid-5 .dot:nth-child(5) { grid-column: 3; grid-row: 3; }
        .dice-3d .face .grid-6 { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr 1fr; place-items: center; }
        .dice-3d .face .grid-6 .dot:nth-child(1) { grid-column: 1; grid-row: 1; }
        .dice-3d .face .grid-6 .dot:nth-child(2) { grid-column: 1; grid-row: 3; }
        .dice-3d .face .grid-6 .dot:nth-child(3) { grid-column: 2; grid-row: 1; }
        .dice-3d .face .grid-6 .dot:nth-child(4) { grid-column: 2; grid-row: 3; }
        .dice-3d .face .grid-6 .dot:nth-child(5) { grid-column: 1; grid-row: 2; }
        .dice-3d .face .grid-6 .dot:nth-child(6) { grid-column: 2; grid-row: 2; }
        .dice-3d .face-front { transform: translateZ(24px); }
        .dice-3d .face-back { transform: rotateY(180deg) translateZ(24px); }
        .dice-3d .face-right { transform: rotateY(90deg) translateZ(24px); }
        .dice-3d .face-left { transform: rotateY(-90deg) translateZ(24px); }
        .dice-3d .face-top { transform: rotateX(90deg) translateZ(24px); }
        .dice-3d .face-bottom { transform: rotateX(-90deg) translateZ(24px); }
        .dice-question { line-height: 1.4; word-break: break-word; }
    </style>

                    saveBtn.innerHTML = '<span class="icon-svg" style="width:14px;height:14px;"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></span>';
                    saveBtn.addEventListener('click', function() { var newText = editInput.value.trim(); if (newText) { var idx = replyPool.indexOf(text); if (idx !== -1) { replyPool[idx] = newText; savePool(); } } item.classList.remove('editing'); renderCards(); updateCount(); });
                    var delBtn = document.createElement('button'); delBtn.className = 'del';
                    delBtn.innerHTML = '<span class="icon-svg" style="width:14px;height:14px;"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></span>';
                    delBtn.addEventListener('click', function() { if (confirm('删除「' + text + '」？')) { var idx = replyPool.indexOf(text); if (idx !== -1) { replyPool.splice(idx, 1); savePool(); renderCards(); updateCount(); } } });
                    actions.appendChild(editBtn); actions.appendChild(saveBtn); actions.appendChild(delBtn);
                    item.appendChild(checkbox); item.appendChild(textSpan); item.appendChild(editInput); item.appendChild(actions);
                    grid.appendChild(item);
                    editInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); saveBtn.click(); } if (e.key === 'Escape') { editInput.value = text; item.classList.remove('editing'); } });
                })(filtered[i]);
            }
            cardList.appendChild(grid); updateCount();
        }
        function addCard() { var t = prompt('请输入新的字卡：'); if (t && t.trim()) { replyPool.push(t.trim()); savePool(); renderCards(); updateCount(); } }
        function batchImport() { var t = batchInput.value; if (!t.trim()) return; var lines = t.split('\n').map(function(l) { return l.trim(); }).filter(function(l) { return l.length > 0; }); for (var i = 0; i < lines.length; i++) replyPool.push(lines[i]); batchInput.value = ''; savePool(); renderCards(); updateCount(); }
        function dedupPool() { var unique = [], seen = {}; for (var i = 0; i < replyPool.length; i++) { if (!seen[replyPool[i]]) { seen[replyPool[i]] = true; unique.push(replyPool[i]); } } if (unique.length !== replyPool.length) { replyPool = unique; savePool(); renderCards(); updateCount(); } else alert('没有重复的字卡！'); }
        function resetToDefault() { if (confirm('恢复默认字卡列表？')) { replyPool = defaultPool.slice(); savePool(); renderCards(); updateCount(); } }
        cardSearchInput.addEventListener('input', renderCards);
        dedupBtn.addEventListener('click', dedupPool);
        resetDefaultBtn.addEventListener('click', resetToDefault);
        function saveMessages() { try { localStorage.setItem('messages', JSON.stringify(messages)); } catch(e) {} }
        function savePool() { try { localStorage.setItem('pool', JSON.stringify(replyPool)); } catch(e) {} }

        // ===== 背景 =====
        function loadBgImage() { var img = localStorage.getItem('bgImage'); if (img && img !== 'null') bgLayer.style.backgroundImage = 'url("' + img + '")'; }
        loadBgImage();
        bgBtn.addEventListener('click', function() { bgUploader.click(); });
        bgUploader.addEventListener('change', function(e) { if (bgUploader.files && bgUploader.files[0]) { var reader = new FileReader(); reader.onload = function(event) { bgLayer.style.backgroundImage = 'url("' + event.target.result + '")'; localStorage.setItem('bgImage', event.target.result); }; reader.readAsDataURL(bgUploader.files[0]); bgUploader.value = ''; } });

        // ===== 字体 =====
        function applyTextStyles() {
            var font = localStorage.getItem('fontFamily') || "'Noto Sans SC', system-ui, sans-serif";
            var size = localStorage.getItem('fontSize') || '14';
            var color = localStorage.getItem('textColor') || '#5a3e44';
            document.documentElement.style.setProperty('--font-family', font);
            document.documentElement.style.setProperty('--font-size', size + 'px');
            document.documentElement.style.setProperty('--text-color', color);
            fontSelect.value = font; fontSizeInput.value = size; textColorInput.value = color;
            render();
        }
        applyTextStyles();
        fontSelect.addEventListener('change', function() { localStorage.setItem('fontFamily', this.value); applyTextStyles(); });
        fontSizeInput.addEventListener('change', function() { var v = parseInt(this.value) || 14; if (v < 10) v = 10; if (v > 24) v = 24; localStorage.setItem('fontSize', String(v)); applyTextStyles(); });
        textColorInput.addEventListener('input', function() { localStorage.setItem('textColor', this.value); applyTextStyles(); });

        // ===== 番茄设置 =====
        function loadPatMessage() { var saved = localStorage.getItem('patMessage'); if (saved) { patMessage = saved; patInput.value = saved; patPreview.textContent = '当前: ' + saved; } }
        loadPatMessage();
        savePatBtn.addEventListener('click', function() { var val = patInput.value.trim(); if (val) { patMessage = val; localStorage.setItem('patMessage', val); patPreview.textContent = '当前: ' + val; } });
        patInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); savePatBtn.click(); } });

        // ===== 主题 =====
        function applySettings() {
            var theme = localStorage.getItem('themeColor') || '#fff5f7';
            var leftB = localStorage.getItem('leftBubble') || '#fde8ee';
            var rightB = localStorage.getItem('rightBubble') || '#f8d8e0';
            document.documentElement.style.setProperty('--theme-bg', theme);
            document.documentElement.style.setProperty('--theme-border', theme);
            document.documentElement.style.setProperty('--theme-input', theme);
            document.documentElement.style.setProperty('--bubble-left-bg', leftB);
            document.documentElement.style.setProperty('--bubble-right-bg', rightB);
            themeColor.value = theme; leftBubbleColor.value = leftB; rightBubbleColor.value = rightB;
        }
        applySettings();
        themeColor.addEventListener('input', function() { localStorage.setItem('themeColor', this.value); applySettings(); });
        leftBubbleColor.addEventListener('input', function() { localStorage.setItem('leftBubble', this.value); applySettings(); });
        rightBubbleColor.addEventListener('input', function() { localStorage.setItem('rightBubble', this.value); applySettings(); });

        // ===== 通话 =====
        function formatTime(s) { return String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0'); }
        function startCallTimer() { callSeconds = 0; if (callTimer) clearInterval(callTimer); callTimer = setInterval(function() { callSeconds++; var t = formatTime(callSeconds); floatTime.textContent = t; callBigTimer.textContent = t; }, 1000); }
        function stopCallTimer() { if (callTimer) { clearInterval(callTimer); callTimer = null; } }
        function showCallFloat() { callFloat.style.display = 'flex'; callBigName.textContent = localStorage.getItem('pName') || '凛'; }
        function hideCallFloat() { callFloat.style.display = 'none'; callFullscreen.classList.remove('open'); callBigStatus.textContent = '正在呼叫...'; callBigAnswer.classList.remove('show'); }
        function startCall() { if (callState !== 'idle') return; callState = 'calling'; showCallFloat(); callFullscreen.classList.add('open'); callBigStatus.textContent = '正在呼叫...'; callBigTimer.textContent = '00:00'; floatTime.textContent = '00:00'; callBigAnswer.classList.remove('show'); setTimeout(function() { if (callState === 'calling') answerCall(); }, 2000 + Math.random() * 2000); addMsg('📞 发起语音通话', 'sent'); }
        function answerCall() { if (callState !== 'calling' && callState !== 'ringing') return; callState = 'talking'; callBigStatus.textContent = '通话中...'; callBigAnswer.classList.remove('show'); startCallTimer(); addMsg('📞 通话已接通', 'received'); }
        function hangupCall() { if (callState === 'idle') return; var wasTalking = callState === 'talking'; callState = 'idle'; stopCallTimer(); hideCallFloat(); callFullscreen.classList.remove('open'); if (wasTalking) addMsg('📞 通话已结束', 'received'); else addMsg('📞 已取消通话', 'sent'); }

        // ===== 悬浮窗拖拽 =====
        (function() { 
            var el = callFloat; 
            var isDragging = false, isMoved = false, startX, startY, origX, origY; 
            el.addEventListener('touchstart', function(e) { if (callState === 'idle') return; var touch = e.touches[0]; startX = touch.clientX; startY = touch.clientY; var rect = el.getBoundingClientRect(); origX = rect.left; origY = rect.top; isDragging = true; isMoved = false; }, { passive: true }); 
            el.addEventListener('touchmove', function(e) { if (!isDragging || callState === 'idle') return; var touch = e.touches[0]; var dx = touch.clientX - startX; var dy = touch.clientY - startY; if (Math.abs(dx) > 5 || Math.abs(dy) > 5) isMoved = true; e.preventDefault(); var parentRect = el.parentElement.getBoundingClientRect(); var newX = Math.max(0, Math.min(origX + dx, parentRect.width - 60)); var newY = Math.max(0, Math.min(origY + dy, parentRect.height - 60)); el.style.left = newX + 'px'; el.style.top = newY + 'px'; el.style.right = 'auto'; el.style.bottom = 'auto'; }, { passive: false }); 
            el.addEventListener('touchend', function() { isDragging = false; if (isMoved) setTimeout(function() { isMoved = false; }, 50); }); 
            el.addEventListener('click', function(e) { if (isMoved) { e.stopPropagation(); e.preventDefault(); return; } if (callState !== 'idle') callFullscreen.classList.add('open'); }); 
        })();

        // ===== 事件 =====
        sendBtn.addEventListener('click', send);
        diceBtn.addEventListener('click', rollDice);
        input.addEventListener('keydown', function(e) { if (e.key === 'Enter') { e.preventDefault(); if (input.value.trim()) send(); } });
        callBtn.addEventListener('click', function() { if (callState === 'idle') startCall(); else callFullscreen.classList.add('open'); });
        callFullClose.addEventListener('click', function() { if (callState !== 'idle') { callFullscreen.classList.remove('open'); callFloat.style.display = 'flex'; } });
        callBigHangup.addEventListener('click', hangupCall);
        callBigAnswer.addEventListener('click', function() { if (callState === 'ringing') answerCall(); });
        callMuteBtn.addEventListener('click', function() { isMuted = !isMuted; callMuteBtn.style.opacity = isMuted ? '0.5' : '1'; });
        callSpeakerBtn.addEventListener('click', function() { isSpeaker = !isSpeaker; callSpeakerBtn.style.opacity = isSpeaker ? '0.5' : '1'; });
        manageBtn.addEventListener('click', function() { renderCards(); manageModal.classList.add('open'); });
        manageClose.addEventListener('click', function() { manageModal.classList.remove('open'); });
        addCardBtn.addEventListener('click', addCard);
        batchBtn.addEventListener('click', batchImport);
        batchInput.addEventListener('keydown', function(e) { if ((e.ctrlKey || e.shiftKey) && e.key === 'Enter') { e.preventDefault(); batchImport(); } });

        // ===== 初始化 =====
        function load() {
            var pn = localStorage.getItem('pName'); if (pn) pName.textContent = pn;
            var sn = localStorage.getItem('sName'); if (sn) sName.textContent = sn;
            var pool = localStorage.getItem('pool'); if (pool) { try { var parsed = JSON.parse(pool); if (parsed && parsed.length) replyPool = parsed; } catch(e) {} }
            if (!replyPool || replyPool.length === 0) replyPool = defaultPool.slice();
            var min = localStorage.getItem('speedMin'); if (min) { speedMin.value = min; speedMinVal.textContent = min + 's'; }
            var max = localStorage.getItem('speedMax'); if (max) { speedMax.value = max; speedMaxVal.textContent = max + 's'; }
            updateRange();
            var savedMsgs = localStorage.getItem('messages'); if (savedMsgs) { try { var parsed = JSON.parse(savedMsgs); if (parsed && parsed.length) messages = parsed; } catch(e) {} }
            loadPatMessage(); applyTextStyles(); applySettings(); loadSavedAvatars(); renderCards(); updateCount();
            if (messages.length === 0) { setTimeout(function() { addMsg('💗 悄悄话模式已开启', 'received'); }, 200); }
        }
        load();

        ['pAvatar','sAvatar','chatPAvatar','chatSAvatar','callAvatar'].forEach(function(key) {
            var val = localStorage.getItem(key);
            if (val === 'null' || val === 'undefined') localStorage.removeItem(key);
        });

    })();
    </script>
</body>
</html>
